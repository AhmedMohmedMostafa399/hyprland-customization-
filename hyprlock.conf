# ==========================================
# HYPRLOCK CONFIGURATION
# Wallpaper: wallpaperflare.com_wallpaper(11).jpg
# ==========================================

# GENERAL OPTIONS
general {
    hide_cursor = true
    ignore_empty_input = true
}

# BACKGROUND (Applying modern blur to your wallpaper)
background {
    monitor =
    path = /home/ahmed/Pictures/wallpaper/wallpaperflare.com_wallpaper(11).jpg
    
    # Modern Blur adjustments (makes the lock-screen text pop)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME (Large elegant clock)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M %p")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 80
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 150
    halign = center
    valign = center
}

# DATE 
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.6)
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# INPUT FIELD (Sleek, transparent password input)
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    
    # Color scheme
    outer_color = rgba(255, 255, 255, 0.5)
    inner_color = rgba(0, 0, 0, 0.6)
    font_color = rgba(255, 255, 255, 0.8)
    
    fade_on_empty = true
    placeholder_text = <i><span foreground="##ffffffaa">Enter Password...</span></i>
    hide_input = false
    
    position = 0, -40
    halign = center
    valign = center
    
    # Authentication feed colors
    check_color = rgba(255, 255, 255, 0.8)
    fail_color = rgba(255, 85, 85, 0.8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
}
